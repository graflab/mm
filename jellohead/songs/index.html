<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Songbook - Marv Moses Is Jellohead</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Cormorant+Garamond:wght@400;500;600&family=Roboto+Condensed:wght@300;400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep:        #000;
      --bg-warm:        #0a0a0a;
      --ink:            #1d1a16;
      --ink-soft:       #4a443c;
      --muted:          #8a8378;
      --paper:          #f3efe4;
      --paper-hi:       #f7f3e9;
      --paper-edge:     #e6e0d0;
      --paper-shadow:   #b8b0a0;
      --leather:        #1a1a1a;
      --leather-hi:     #2a2a2a;
      --leather-lo:     #0a0a0a;
      --gold:           #b8a880;
      --accent:         #da291c;
      --accent-dark:    #7a1410;
      --line:           #c9c0ad;
      --ff-serif:       "minion-pro", "Source Serif 4", "Source Serif Pro", "EB Garamond", Georgia, serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% 0%, #141414 0%, var(--bg-warm) 40%, var(--bg-deep) 100%);
      color: #d8cbb4;
      font-family: "Roboto Condensed", "Cormorant Garamond", serif;
      padding: 1rem 1rem 1.5rem;
      overflow-x: hidden;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 0.4rem;
    }

    .logo-link {
      display: inline-block;
      margin-bottom: 0.2rem;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .logo-link:hover {
      transform: scale(1.05);
      filter: drop-shadow(0 0 14px rgba(218, 41, 28, 0.45));
    }

    .logo-link img {
      width: 18vw;
      max-width: 72px;
      display: block;
    }

    h1.page-title {
      margin: 0.1rem 0 0;
      font-family: "Abril Fatface", "Cormorant Garamond", serif;
      font-size: clamp(1.3rem, 2.8vw, 1.7rem);
      font-weight: 400;
      letter-spacing: 0.05em;
      color: #e3d8c6;
    }

    /* ---------- Stage / Book ---------- */

    .scene {
      perspective: 2400px;
      perspective-origin: 50% 50%;
      padding: 0.5rem 0 0.2rem;
    }

    .book-shadow {
      position: relative;
      margin: 0 auto;
      width: min(98%, 1040px);
      filter: drop-shadow(0 24px 32px rgba(0,0,0,0.55));
    }

    /* Book holder — lays flat, no tilt */
    .book {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      max-height: calc(100vh - 200px);
      transform-style: preserve-3d;
    }

    /* Outer cover (rendered behind pages) — Moleskine-style matte black */
    .cover {
      position: absolute;
      inset: -8px -8px -8px -12px;
      border-radius: 4px 8px 8px 4px;
      background:
        linear-gradient(160deg, var(--leather-hi) 0%, var(--leather) 50%, var(--leather-lo) 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.03),
        inset 0 -2px 4px rgba(0,0,0,0.6),
        0 2px 0 0 rgba(0,0,0,0.6);
      z-index: 0;
    }

    /* Spine (left binding) */
    .spine {
      position: absolute;
      top: -8px;
      bottom: -8px;
      left: -12px;
      width: 14px;
      border-radius: 4px 0 0 4px;
      background:
        linear-gradient(90deg,
          var(--leather-lo) 0%,
          #050505 50%,
          var(--leather) 100%);
      box-shadow:
        inset 2px 0 3px rgba(0,0,0,0.8),
        inset -1px 0 2px rgba(0,0,0,0.6);
      z-index: 1;
    }

    /* Closed cover that lifts on load to reveal pages */
    .cover-lid {
      position: absolute;
      inset: -8px -8px -8px 4px;
      border-radius: 2px 8px 8px 2px;
      background:
        linear-gradient(135deg, var(--leather-hi) 0%, var(--leather) 50%, var(--leather-lo) 100%);
      box-shadow:
        inset -4px -4px 6px rgba(0,0,0,0.6),
        inset 4px 4px 6px rgba(99,86,72,0.4),
        0 6px 14px rgba(0,0,0,0.4);
      transform-origin: left center;
      transform: rotateY(0deg);
      transition: transform 1400ms cubic-bezier(.7,.04,.34,1), opacity 200ms linear 1300ms;
      z-index: 50;
      backface-visibility: hidden;
      pointer-events: none;
    }

    .cover-lid::after {
      /* Embossed title on the closed cover */
      content: "SONGBOOK";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: "Abril Fatface", "Cormorant Garamond", serif;
      font-size: clamp(1.6rem, 5vw, 2.8rem);
      letter-spacing: 0.25em;
      color: var(--gold);
      text-shadow:
        -1px -1px 0 rgba(0,0,0,0.6),
         1px  1px 0 rgba(255,220,150,0.15);
      opacity: 0.85;
    }

    .book.opened .cover-lid {
      transform: rotateY(-168deg);
      opacity: 0;
    }

    /* The page stack */
    .page-stack {
      position: absolute;
      inset: 4px 4px 4px 14px;
      z-index: 10;
      transform-style: preserve-3d;
    }

    .page {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg,
          rgba(0,0,0,0.10) 0%,
          rgba(0,0,0,0.00) 6%,
          rgba(0,0,0,0.00) 48%,
          rgba(0,0,0,0.22) 50%,
          rgba(0,0,0,0.00) 52%,
          rgba(0,0,0,0.00) 94%,
          rgba(0,0,0,0.10) 100%),
        linear-gradient(180deg, var(--paper-hi) 0%, var(--paper) 100%);
      color: var(--ink);
      padding: clamp(1rem, 3.5vw, 2rem) clamp(1.2rem, 4.5vw, 2.6rem) clamp(1.8rem, 4.5vw, 2.6rem);
      border-radius: 0 8px 8px 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transform-origin: left center;
      backface-visibility: hidden;
      box-shadow:
        inset 12px 0 18px -10px rgba(0,0,0,0.45),
        inset -2px 0 4px rgba(0,0,0,0.08);
      opacity: 0;
      pointer-events: none;
      transform: rotateY(0deg);
      will-change: transform, opacity;
    }

    .page.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 2;
    }



    /* Shading overlay swept over the turning page (sells the 3D bend) */
    .page-shade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      background: linear-gradient(90deg,
        rgba(0,0,0,0.45) 0%,
        rgba(0,0,0,0.15) 20%,
        rgba(0,0,0,0.0)  50%,
        rgba(255,255,255,0.12) 80%,
        rgba(255,255,255,0.25) 100%);
      opacity: 0;
    }

    .page.flipping-forward {
      opacity: 1;
      z-index: 3;
      animation: flipForward 850ms cubic-bezier(.55,.05,.35,1) forwards;
    }
    .page.flipping-forward .page-shade {
      animation: shadeForward 850ms cubic-bezier(.55,.05,.35,1) forwards;
    }

    .page.flipping-back {
      opacity: 1;
      z-index: 3;
      animation: flipBack 850ms cubic-bezier(.55,.05,.35,1) forwards;
    }
    .page.flipping-back .page-shade {
      animation: shadeBack 850ms cubic-bezier(.55,.05,.35,1) forwards;
    }

    @keyframes flipForward {
      0%   { transform: rotateY(0deg); }
      100% { transform: rotateY(-178deg); }
    }
    @keyframes flipBack {
      0%   { transform: rotateY(-178deg); }
      100% { transform: rotateY(0deg); }
    }
    @keyframes shadeForward {
      0%   { opacity: 0; }
      45%  { opacity: 0.9; }
      100% { opacity: 0; }
    }
    @keyframes shadeBack {
      0%   { opacity: 0; }
      45%  { opacity: 0.9; }
      100% { opacity: 0; }
    }

    /* Page content */
    .page-content {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      padding-right: 0.4rem;
      display: flex;
      flex-direction: column;
    }

    .page-number {
      position: absolute;
      bottom: 0.7rem;
      left: 0;
      right: 0;
      text-align: center;
      font-family: "Special Elite", "Roboto Condensed", monospace;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* Cover page (inside) */
    .page.cover-page {
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(180deg, var(--paper-hi) 0%, var(--paper) 100%);
    }
    .page.cover-page .page-content {
      align-items: center;
      justify-content: center;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      padding: clamp(1rem, 4vw, 2.2rem);
      overflow: hidden;
    }
    .cover-title {
      font-family: var(--ff-serif);
      font-weight: 600;
      font-size: clamp(1.8rem, 5.2vw, 3rem);
      line-height: 1.05;
      letter-spacing: 0.04em;
      color: var(--ink);
      margin: 0;
    }
    .cover-sub {
      margin-top: 1.2rem;
      font-family: var(--ff-serif);
      font-style: italic;
      font-weight: 400;
      font-size: clamp(0.85rem, 1.7vw, 1.05rem);
      letter-spacing: 0.04em;
      color: var(--ink-soft);
    }
    .cover-mark {
      margin-top: 1.4rem;
      font-size: 0.7rem;
      letter-spacing: 0.5em;
      color: var(--ink-soft);
      opacity: 0.5;
    }

    /* TOC */
    .toc-title,
    .song-title {
      font-family: var(--ff-serif);
      font-weight: 600;
      font-size: clamp(1.1rem, 2.9vw, 1.55rem);
      color: var(--ink);
      margin: 0 0 0.8rem;
      text-align: center;
      letter-spacing: 0.02em;
    }
    .toc-title {
      font-variant: small-caps;
      font-weight: 500;
      letter-spacing: 0.25em;
      font-size: clamp(0.95rem, 2.3vw, 1.2rem);
      margin-bottom: 1.4rem;
      color: var(--ink-soft);
    }
    .section-rule {
      display: none;
    }
    .toc-list {
      list-style: none;
      margin: 0;
      padding: 0 clamp(0.5rem, 4vw, 2.5rem);
      font-family: var(--ff-serif);
      font-size: clamp(0.75rem, 1.4vw, 0.85rem);
      color: var(--ink);
    }
    .toc-list li {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      padding: 0.32rem 0;
      border: 0;
    }
    .toc-list a {
      color: var(--ink);
      text-decoration: none;
      transition: color 0.2s ease;
      flex: 0 0 auto;
      font-weight: 400;
      font-style: italic;
    }
    .toc-list a:hover,
    .toc-list a:focus {
      color: var(--accent);
      outline: none;
    }
    .toc-leader {
      flex: 1 1 auto;
      margin: 0 0.4rem;
      border: 0;
    }
    .toc-pagenum {
      flex: 0 0 auto;
      font-family: var(--ff-serif);
      font-size: 0.95em;
      color: var(--ink-soft);
      font-variant-numeric: oldstyle-nums;
    }

    /* Song page */
    .spread {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(1.5rem, 5vw, 3.5rem);
    }
    .spread-col {
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .spread-col .song-title {
      flex: 0 0 auto;
      font-size: clamp(1rem, 2.15vw, 1.4rem);
      margin: 0 0 0.9rem;
    }
    .spread-col .section-rule {
      display: none;
    }
    .spread-col .song-cont {
      flex: 0 0 auto;
      font-family: var(--ff-serif);
      font-style: italic;
      font-size: clamp(0.6rem, 1.05vw, 0.7rem);
      color: var(--ink-soft);
      text-align: center;
      margin: 0 0 0.6rem;
      letter-spacing: 0.04em;
    }
    .lyrics {
      margin: 0;
      white-space: pre-wrap;
      color: var(--ink);
      font-size: clamp(0.62rem, 1.05vw, 0.72rem);
      line-height: 1.5;
      font-family: var(--ff-serif);
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    .loading-page {
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--ink-soft);
      font-family: "Special Elite", "Roboto Condensed", monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Navigation */
    .nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin: 1rem auto 0;
      max-width: 760px;
    }
    .nav button {
      background: rgba(241, 228, 201, 0.06);
      color: #e3d8c6;
      border: 1px solid rgba(241, 228, 201, 0.32);
      font-family: "Roboto Condensed", "Special Elite", monospace;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.78rem;
      padding: 0.55rem 1.1rem;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }
    .nav button:hover:not(:disabled) {
      background: rgba(218, 41, 28, 0.22);
      border-color: var(--accent);
      color: #fff;
      transform: translateY(-1px);
    }
    .nav button:disabled {
      opacity: 0.32;
      cursor: not-allowed;
    }
    .nav .indicator {
      font-family: "Special Elite", "Roboto Condensed", monospace;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #c9b993;
      min-width: 7rem;
      text-align: center;
    }
    .hint {
      text-align: center;
      margin: 0.5rem 0 0;
      color: #7a6a52;
      font-family: "Special Elite", "Roboto Condensed", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .page {
      padding: clamp(1rem, 3vw, 1.8rem) clamp(1.4rem, 4vw, 2.6rem) clamp(1.6rem, 3.5vw, 2.4rem);
    }
    .page-content > .song-title,
    .page-content > .section-rule,
    .page-content > .toc-title { flex: 0 0 auto; }
    @media (max-width: 700px) {
      .book { aspect-ratio: 3 / 4; }
      .spread {
        grid-template-columns: 1fr;
        gap: 0.6rem;
      }
    }
    @media (max-width: 600px) {
      body { padding: 0.6rem 0.5rem 1rem; }
      .logo-link img { width: 22vw; max-width: 64px; }
      .book {
        aspect-ratio: 3 / 4.2;
        max-height: calc(100vh - 170px);
      }
      .spine { width: 10px; left: -8px; }
      .page-stack { inset: 3px 3px 3px 10px; }
      .nav button { padding: 0.45rem 0.7rem; font-size: 0.7rem; }
      .nav { gap: 0.5rem; }
      .nav .indicator { min-width: 5.5rem; font-size: 0.7rem; }
      .page.flipping-forward,
      .page.flipping-back { animation-duration: 700ms; }
      .page.flipping-forward .page-shade,
      .page.flipping-back .page-shade { animation-duration: 700ms; }
    }

    @media (prefers-reduced-motion: reduce) {
      .book,
      .cover-lid,
      .page,
      .page.flipping-forward,
      .page.flipping-back,
      .page-shade {
        animation: none !important;
        transition: opacity 0.2s ease !important;
        transform: none !important;
      }
      .book.opened .cover-lid { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a href="/jellohead" class="logo-link" aria-label="Back to home">
        <img src="/jellohead/logo.svg" alt="Marv Moses">
      </a>
      <h1 class="page-title"></h1>
    </header>

    <div class="scene">
      <div class="book-shadow">
        <div class="book" id="book" aria-live="polite">
          <div class="cover" aria-hidden="true"></div>
          <div class="spine" aria-hidden="true"></div>
          <div class="page-stack" id="page-stack">
            <div class="page loading-page active" id="loading-page">
              <div>Loading songbook…</div>
            </div>
          </div>
          <div class="cover-lid" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <nav class="nav" aria-label="Songbook navigation">
      <button type="button" id="prev-btn" aria-label="Previous page" disabled>&lsaquo; Prev</button>
      <span class="indicator" id="indicator">— / —</span>
      <button type="button" id="next-btn" aria-label="Next page" disabled>Next &rsaquo;</button>
    </nav>
    <p class="hint">Use the buttons or &larr; &rarr; keys to turn the pages</p>
  </div>

  <script>
    const songs = [
      { title: "A Fire Inside",   file: "A_Fire_Inside.txt" },
      { title: "Come Back Down",  file: "Come_Back_Down.txt" },
      { title: "Greasy Sun",      file: "Greasy_Sun.txt" },
      { title: "Halifax",         file: "Halifax.txt" },
      { title: "Sagebrush",       file: "Sagebrush.txt" },
      { title: "Say I Can Stay",  file: "Say_I_Can_Stay.txt" },
      { title: "Snapdragons",     file: "Snapdragons.txt" },
      { title: "Sunrise",         file: "Sunrise.txt" },
      { title: "Take Two",        file: "Take_Two.txt" },
      { title: "Time Trial",      file: "Time_Trial.txt" },
      { title: "Tired Twin",      file: "Tired_Twin.txt" },
      { title: "Well Dad",        file: "Well_Dad.txt" },
      { title: "Your Eyes Were Glassy But They Were Windows",       file: "Your_Eyes_Were_Glassy_But_They_Were_Windows.txt" },
    ];

    const book      = document.getElementById("book");
    const stack     = document.getElementById("page-stack");
    const prevBtn   = document.getElementById("prev-btn");
    const nextBtn   = document.getElementById("next-btn");
    const indicator = document.getElementById("indicator");

    let pages = [];
    let currentIndex = 0;
    let isFlipping = false;

    const reduceMotion = () =>
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function createPage(extraClass) {
      const page = document.createElement("section");
      page.className = "page" + (extraClass ? " " + extraClass : "");
      // shading overlay used during flip
      const shade = document.createElement("div");
      shade.className = "page-shade";
      shade.setAttribute("aria-hidden", "true");
      page.appendChild(shade);
      return page;
    }

    function buildCoverPage() {
      const page = createPage("cover-page");
      const content = document.createElement("div");
      content.className = "page-content";
      content.innerHTML = `
        <h2 class="cover-title">Marv Moses</h2>
        <div class="cover-sub">Songbook</div>
        <div class="cover-mark" aria-hidden="true">·</div>
      `;
      page.appendChild(content);
      return page;
    }

    function buildTocPage(songEntries, songStartPageNums) {
      const page = createPage("toc");
      const items = songEntries.map((entry, idx) => {
        const pageNum1 = songStartPageNums ? songStartPageNums[idx] : (3 + idx);
        const pageIndex0 = pageNum1 - 1;
        return `
          <li>
            <a href="#" data-page-index="${pageIndex0}">${entry.title}</a>
            <span class="toc-leader" aria-hidden="true"></span>
            <span class="toc-pagenum">${pageNum1}</span>
          </li>
        `;
      }).join("");

      const content = document.createElement("div");
      content.className = "page-content";
      content.innerHTML = `
        <h2 class="toc-title">Contents</h2>
        <div class="section-rule"></div>
        <ol class="toc-list">${items}</ol>
      `;
      page.appendChild(content);

      const num = document.createElement("div");
      num.className = "page-number";
      num.textContent = "ii";
      page.appendChild(num);
      return page;
    }

    // Build the DOM shell for one spread of a song.
    // First spread shows the title; continuation spreads show "Title (cont.)".
    function buildSongSpread(title, isContinuation) {
      const page = createPage("song");
      const content = document.createElement("div");
      content.className = "page-content";

      const spread = document.createElement("div");
      spread.className = "spread";

      const leftCol = document.createElement("div");
      leftCol.className = "spread-col spread-col-left";

      if (!isContinuation) {
        const heading = document.createElement("h2");
        heading.className = "song-title";
        heading.textContent = title;
        const rule = document.createElement("div");
        rule.className = "section-rule";
        leftCol.appendChild(heading);
        leftCol.appendChild(rule);
      } else {
        const cont = document.createElement("div");
        cont.className = "song-cont";
        cont.textContent = title + " — cont.";
        leftCol.appendChild(cont);
      }

      const leftPre = document.createElement("pre");
      leftPre.className = "lyrics";
      leftCol.appendChild(leftPre);

      const rightCol = document.createElement("div");
      rightCol.className = "spread-col spread-col-right";
      const rightPre = document.createElement("pre");
      rightPre.className = "lyrics";
      rightCol.appendChild(rightPre);

      spread.appendChild(leftCol);
      spread.appendChild(rightCol);
      content.appendChild(spread);
      page.appendChild(content);

      const num = document.createElement("div");
      num.className = "page-number";
      num.textContent = "";
      page.appendChild(num);
      return page;
    }

    // Greedily fill a <pre> with lines until it would overflow its column.
    // Returns the next line index to consume.
    function fillPre(pre, lines, startIdx) {
      let i = startIdx;
      pre.textContent = "";
      let placedAny = false;
      // Skip leading blank lines at the start of a column
      while (i < lines.length && lines[i].trim() === "") i++;
      while (i < lines.length) {
        const prev = pre.textContent;
        pre.textContent = (prev ? prev + "\n" : "") + lines[i];
        if (pre.scrollHeight > pre.clientHeight + 1) {
          if (!placedAny) {
            // Force one line so we always make progress
            i++;
            placedAny = true;
            continue;
          }
          // Greedy fill — verses may split across columns/spreads.
          pre.textContent = prev;
          break;
        }
        i++;
        placedAny = true;
      }
      pre.textContent = pre.textContent.replace(/\s+$/, "");
      return i;
    }

    // Paginate one song into one or more spread pages.
    // Spreads must be appended into the live page-stack so layout is computed.
    function paginateSongInto(title, lyrics) {
      const normalized = lyrics.replace(/\r\n/g, "\n").replace(/\n{3,}/g, "\n\n");
      const lines = normalized.split("\n");
      const spreads = [];
      let idx = 0;
      let isCont = false;
      let safety = 0;

      while (idx < lines.length && safety++ < 20) {
        const page = buildSongSpread(title, isCont);
        stack.appendChild(page);

        const leftPre  = page.querySelector(".spread-col-left  .lyrics");
        const rightPre = page.querySelector(".spread-col-right .lyrics");

        idx = fillPre(leftPre, lines, idx);
        if (idx < lines.length) {
          idx = fillPre(rightPre, lines, idx);
        }

        spreads.push(page);
        isCont = true;
      }

      if (spreads.length === 0) {
        // Empty lyrics — still emit a single page so the song exists.
        const page = buildSongSpread(title, false);
        stack.appendChild(page);
        spreads.push(page);
      }

      return spreads;
    }

    function buildErrorPage(title, pageNum) {
      const page = createPage("song");

      const content = document.createElement("div");
      content.className = "page-content";
      content.style.display = "flex";
      content.style.flexDirection = "column";
      content.style.alignItems = "center";
      content.style.justifyContent = "center";
      content.style.textAlign = "center";

      const heading = document.createElement("h2");
      heading.className = "song-title";
      heading.textContent = title;

      const rule = document.createElement("div");
      rule.className = "section-rule";

      const msg = document.createElement("p");
      msg.textContent = "Lyrics unavailable right now.";
      msg.style.cssText =
        "color: var(--accent); font-family: 'Special Elite', 'Roboto Condensed', monospace; " +
        "letter-spacing: 0.1em; text-transform: uppercase; font-size: 0.85rem;";

      content.appendChild(heading);
      content.appendChild(rule);
      content.appendChild(msg);
      page.appendChild(content);

      const num = document.createElement("div");
      num.className = "page-number";
      num.textContent = pageNum;
      page.appendChild(num);
      return page;
    }

    function updateIndicator() {
      const total = pages.length;
      indicator.textContent = `${currentIndex + 1} / ${total}`;
      prevBtn.disabled = currentIndex <= 0 || isFlipping;
      nextBtn.disabled = currentIndex >= total - 1 || isFlipping;
    }

    function showPage(index, direction) {
      if (index < 0 || index >= pages.length) return;
      if (index === currentIndex) return;

      const current = pages[currentIndex];
      const target  = pages[index];

      if (reduceMotion()) {
        current.classList.remove("active");
        target.classList.add("active");
        currentIndex = index;
        updateIndicator();
        return;
      }

      isFlipping = true;
      updateIndicator();

      if (direction === "forward") {
        target.classList.add("active");
        current.classList.add("flipping-forward");
        const onEnd = () => {
          current.classList.remove("active", "flipping-forward");
          current.style.transform = "";
          currentIndex = index;
          isFlipping = false;
          updateIndicator();
          current.removeEventListener("animationend", onEnd);
        };
        current.addEventListener("animationend", onEnd);
      } else {
        target.style.transform = "rotateY(-178deg)";
        target.classList.add("active", "flipping-back");
        const onEnd = () => {
          current.classList.remove("active");
          target.classList.remove("flipping-back");
          target.style.transform = "";
          currentIndex = index;
          isFlipping = false;
          updateIndicator();
          target.removeEventListener("animationend", onEnd);
        };
        target.addEventListener("animationend", onEnd);
      }
    }

    function goNext() {
      if (isFlipping) return;
      if (currentIndex < pages.length - 1) showPage(currentIndex + 1, "forward");
    }
    function goPrev() {
      if (isFlipping) return;
      if (currentIndex > 0) showPage(currentIndex - 1, "backward");
    }
    function goTo(index) {
      if (isFlipping || index === currentIndex) return;
      const direction = index > currentIndex ? "forward" : "backward";
      showPage(index, direction);
    }

    prevBtn.addEventListener("click", goPrev);
    nextBtn.addEventListener("click", goNext);

    document.addEventListener("keydown", (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); goNext(); }
      else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); goPrev(); }
      else if (e.key === "Home") { e.preventDefault(); goTo(0); }
      else if (e.key === "End")  { e.preventDefault(); goTo(pages.length - 1); }
    });

    async function loadSongbook() {
      const results = await Promise.allSettled(
        songs.map(async ({ title, file }) => {
          const safeFile = encodeURIComponent(file);
          const response = await fetch(`/assets/lyrics/${safeFile}`);
          if (!response.ok) {
            throw new Error(`Could not load ${file}: ${response.status} ${response.statusText}`);
          }
          const text = await response.text();
          return { title, lyrics: text };
        })
      );

      const loaded = results.map((result, idx) => {
        if (result.status === "fulfilled") {
          return { title: songs[idx].title, lyrics: result.value.lyrics, ok: true };
        }
        console.error("Songbook lyric load failure:", songs[idx].title, result.reason);
        return { title: songs[idx].title, lyrics: "", ok: false };
      });

      // Reset page stack
      stack.textContent = "";
      pages = [];

      // 1. Cover
      const coverPage = buildCoverPage();
      stack.appendChild(coverPage);
      pages.push(coverPage);

      // 2. TOC placeholder — paginating songs needs the stack to have layout,
      //    and we want the TOC to sit at index 1. We'll swap in the real TOC
      //    once song page numbers are known.
      const tocPlaceholder = createPage("toc");
      stack.appendChild(tocPlaceholder);
      pages.push(tocPlaceholder);

      // Wait for fonts so measurement is accurate
      if (document.fonts && document.fonts.ready) {
        try { await document.fonts.ready; } catch (_) {}
      }

      // 3. Paginate each song, recording its starting 1-based page number
      const songStartPageNums = [];
      loaded.forEach((entry) => {
        const startPageNum = pages.length + 1;
        songStartPageNums.push(startPageNum);
        const spreads = entry.ok
          ? paginateSongInto(entry.title, entry.lyrics)
          : (() => {
              const p = buildErrorPage(entry.title, "");
              stack.appendChild(p);
              return [p];
            })();
        for (const sp of spreads) pages.push(sp);
      });

      // 4. Replace TOC placeholder with the real TOC
      const tocPage = buildTocPage(loaded, songStartPageNums);
      stack.replaceChild(tocPage, tocPlaceholder);
      pages[1] = tocPage;

      // 5. Renumber every page's footer
      pages.forEach((p, i) => {
        const num = p.querySelector(".page-number");
        if (!num) return;
        if (p.classList.contains("cover-page")) { num.textContent = ""; return; }
        if (i === 1) { num.textContent = "ii"; return; }
        num.textContent = String(i + 1);
      });

      pages[0].classList.add("active");
      currentIndex = 0;
      updateIndicator();

      // TOC links
      stack.addEventListener("click", (e) => {
        const link = e.target.closest("a[data-page-index]");
        if (!link) return;
        e.preventDefault();
        const idx = parseInt(link.getAttribute("data-page-index"), 10);
        if (Number.isInteger(idx) && idx >= 0 && idx < pages.length) goTo(idx);
      });

      // Open the cover after a beat
      requestAnimationFrame(() => {
        setTimeout(() => book.classList.add("opened"), 350);
      });
    }

    loadSongbook();
  </script>
</body>
</html>
