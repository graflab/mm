<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Songbook - Marv Moses Is Jellohead</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Cormorant+Garamond:wght@400;500;600&family=Roboto+Condensed:wght@300;400;700&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep:        #000;
      --bg-warm:        #150b07;
      --ink:            #2a1d10;
      --ink-soft:       #4a3826;
      --muted:          #7a6a52;
      --paper:          #f3e3bd;
      --paper-hi:       #f8ecc6;
      --paper-edge:     #d9c391;
      --paper-shadow:   #ad9362;
      --leather:        #2e1800;
      --leather-hi:     #5b3a1d;
      --leather-lo:     #1a0c04;
      --gold:           #c9a86a;
      --accent:         #da291c;
      --accent-dark:    #7a1410;
      --line:           #b9a47c;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% 0%, #1a0f08 0%, var(--bg-warm) 40%, var(--bg-deep) 100%);
      color: #d8cbb4;
      font-family: "Roboto Condensed", "Cormorant Garamond", serif;
      padding: 1rem 1rem 1.5rem;
      overflow-x: hidden;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 0.4rem;
    }

    .logo-link {
      display: inline-block;
      margin-bottom: 0.2rem;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .logo-link:hover {
      transform: scale(1.05);
      filter: drop-shadow(0 0 14px rgba(218, 41, 28, 0.45));
    }

    .logo-link img {
      width: 18vw;
      max-width: 72px;
      display: block;
    }

    h1.page-title {
      margin: 0.1rem 0 0;
      font-family: "Abril Fatface", "Cormorant Garamond", serif;
      font-size: clamp(1.3rem, 2.8vw, 1.7rem);
      font-weight: 400;
      letter-spacing: 0.05em;
      color: #e3d8c6;
    }

    /* ---------- Stage / Book ---------- */

    .scene {
      perspective: 2400px;
      perspective-origin: 50% 30%;
      padding: 0.5rem 0 0.2rem;
    }

    .book-shadow {
      position: relative;
      margin: 0 auto;
      width: min(96%, 760px);
      filter: drop-shadow(0 30px 40px rgba(0,0,0,0.55));
    }

    /* Tilted/leveling holder */
    .book {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      max-height: calc(100vh - 200px);
      transform-style: preserve-3d;
      transform: rotateX(14deg) rotateZ(-2.5deg);
      transition: transform 900ms cubic-bezier(.165,.84,.44,1);
    }

    .book:hover,
    .book:focus-within {
      transform: rotateX(4deg) rotateZ(-0.6deg);
    }

    /* Outer leather cover (rendered behind pages) */
    .cover {
      position: absolute;
      inset: -10px -10px -10px -14px;
      border-radius: 6px 12px 12px 6px;
      background:
        radial-gradient(ellipse at 30% 20%, #4a2611 0%, transparent 55%),
        radial-gradient(ellipse at 80% 90%, #1a0c04 0%, transparent 55%),
        linear-gradient(160deg, var(--leather-hi) 0%, var(--leather) 45%, var(--leather-lo) 100%);
      box-shadow:
        inset 4px -4px 6px 1px rgba(99, 86, 72, 0.6),
        inset 6px -6px 8px 0 rgba(34, 27, 20, 0.9),
        inset -3px 3px 6px 0 rgba(34, 27, 20, 0.6),
        0 2px 0 0 rgba(0,0,0,0.6);
      z-index: 0;
    }

    /* Subtle stitched border on the cover */
    .cover::before {
      content: "";
      position: absolute;
      inset: 10px 10px 10px 22px;
      border: 1px dashed rgba(201, 168, 106, 0.18);
      border-radius: 4px 8px 8px 4px;
      pointer-events: none;
    }

    /* Spine (left binding) */
    .spine {
      position: absolute;
      top: -10px;
      bottom: -10px;
      left: -14px;
      width: 18px;
      border-radius: 6px 0 0 6px;
      background:
        linear-gradient(90deg,
          var(--leather-hi) 0%,
          var(--leather-lo) 30%,
          var(--leather) 55%,
          var(--leather-lo) 80%,
          var(--leather-hi) 100%);
      box-shadow:
        inset 2px 0 3px rgba(0,0,0,0.7),
        inset -2px 0 4px rgba(0,0,0,0.55);
      z-index: 1;
    }

    .spine::before,
    .spine::after {
      content: "";
      position: absolute;
      left: 4px;
      right: 4px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,106,0.35), transparent);
    }
    .spine::before { top: 18%; }
    .spine::after  { bottom: 18%; }

    /* Closed cover that lifts on load to reveal pages */
    .cover-lid {
      position: absolute;
      inset: -10px -10px -10px 4px;
      border-radius: 4px 12px 12px 4px;
      background:
        radial-gradient(ellipse at 25% 25%, #4a2611 0%, transparent 55%),
        linear-gradient(135deg, var(--leather-hi) 0%, var(--leather) 50%, var(--leather-lo) 100%);
      box-shadow:
        inset -4px -4px 6px rgba(0,0,0,0.6),
        inset 4px 4px 6px rgba(99,86,72,0.4),
        0 6px 14px rgba(0,0,0,0.4);
      transform-origin: left center;
      transform: rotateY(0deg);
      transition: transform 1400ms cubic-bezier(.7,.04,.34,1), opacity 200ms linear 1300ms;
      z-index: 50;
      backface-visibility: hidden;
      pointer-events: none;
    }

    .cover-lid::after {
      /* Embossed title on the closed cover */
      content: "SONGBOOK";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: "Abril Fatface", "Cormorant Garamond", serif;
      font-size: clamp(1.6rem, 5vw, 2.8rem);
      letter-spacing: 0.25em;
      color: var(--gold);
      text-shadow:
        -1px -1px 0 rgba(0,0,0,0.6),
         1px  1px 0 rgba(255,220,150,0.15);
      opacity: 0.85;
    }

    .book.opened .cover-lid {
      transform: rotateY(-168deg);
      opacity: 0;
    }

    /* The page stack */
    .page-stack {
      position: absolute;
      inset: 6px 6px 6px 18px;
      z-index: 10;
      transform-style: preserve-3d;
    }

    .page {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 0% 50%, rgba(0,0,0,0.18) 0%, transparent 12%),
        repeating-linear-gradient(
          to bottom,
          rgba(155, 130, 90, 0.04) 0px,
          rgba(155, 130, 90, 0.04) 2px,
          transparent 2px,
          transparent 6px
        ),
        linear-gradient(180deg, var(--paper-hi) 0%, var(--paper) 60%, var(--paper-edge) 100%);
      color: var(--ink);
      padding: clamp(1rem, 3.5vw, 2rem) clamp(1.2rem, 4.5vw, 2.6rem) clamp(1.8rem, 4.5vw, 2.6rem);
      border-radius: 0 8px 8px 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transform-origin: left center;
      backface-visibility: hidden;
      box-shadow:
        inset 12px 0 18px -10px rgba(0,0,0,0.45),
        inset -2px 0 4px rgba(0,0,0,0.08);
      opacity: 0;
      pointer-events: none;
      transform: rotateY(0deg);
      will-change: transform, opacity;
    }

    .page.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 2;
    }

    /* Top-right page-corner fold detail */
    .page::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: clamp(22px, 4vw, 36px);
      height: clamp(22px, 4vw, 36px);
      background:
        linear-gradient(225deg,
          transparent 47%,
          rgba(0,0,0,0.12) 48%,
          var(--paper-edge) 50%,
          var(--paper-hi) 60%,
          var(--paper) 100%);
      box-shadow: -3px 3px 6px -3px rgba(0,0,0,0.25);
      pointer-events: none;
      opacity: 0.9;
      border-bottom-left-radius: 4px;
    }

    /* Shading overlay swept over the turning page (sells the 3D bend) */
    .page-shade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      background: linear-gradient(90deg,
        rgba(0,0,0,0.45) 0%,
        rgba(0,0,0,0.15) 20%,
        rgba(0,0,0,0.0)  50%,
        rgba(255,255,255,0.12) 80%,
        rgba(255,255,255,0.25) 100%);
      opacity: 0;
    }

    .page.flipping-forward {
      opacity: 1;
      z-index: 3;
      animation: flipForward 850ms cubic-bezier(.55,.05,.35,1) forwards;
    }
    .page.flipping-forward .page-shade {
      animation: shadeForward 850ms cubic-bezier(.55,.05,.35,1) forwards;
    }

    .page.flipping-back {
      opacity: 1;
      z-index: 3;
      animation: flipBack 850ms cubic-bezier(.55,.05,.35,1) forwards;
    }
    .page.flipping-back .page-shade {
      animation: shadeBack 850ms cubic-bezier(.55,.05,.35,1) forwards;
    }

    @keyframes flipForward {
      0%   { transform: rotateY(0deg); }
      100% { transform: rotateY(-178deg); }
    }
    @keyframes flipBack {
      0%   { transform: rotateY(-178deg); }
      100% { transform: rotateY(0deg); }
    }
    @keyframes shadeForward {
      0%   { opacity: 0; }
      45%  { opacity: 0.9; }
      100% { opacity: 0; }
    }
    @keyframes shadeBack {
      0%   { opacity: 0; }
      45%  { opacity: 0.9; }
      100% { opacity: 0; }
    }

    /* Page content */
    .page-content {
      flex: 1 1 auto;
      overflow-y: auto;
      padding-right: 0.4rem;
      scrollbar-width: thin;
      scrollbar-color: var(--paper-shadow) transparent;
    }
    .page-content::-webkit-scrollbar { width: 8px; }
    .page-content::-webkit-scrollbar-thumb {
      background: var(--paper-shadow);
      border-radius: 4px;
    }

    .page-number {
      position: absolute;
      bottom: 0.7rem;
      left: 0;
      right: 0;
      text-align: center;
      font-family: "Special Elite", "Roboto Condensed", monospace;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* Cover page (inside) */
    .page.cover-page {
      align-items: center;
      justify-content: center;
      text-align: center;
      background:
        radial-gradient(ellipse at center, rgba(218, 41, 28, 0.08) 0%, transparent 65%),
        linear-gradient(180deg, var(--paper-hi) 0%, var(--paper-edge) 100%);
    }
    .page.cover-page .page-content {
      align-items: center;
      justify-content: center;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      padding: clamp(0.8rem, 3vw, 1.6rem);
      border: 3px double var(--accent-dark);
      outline: 1px solid var(--accent-dark);
      outline-offset: 6px;
      overflow: hidden;
    }
    .cover-eyebrow {
      font-family: "Special Elite", "Roboto Condensed", monospace;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      font-size: clamp(0.7rem, 1.6vw, 0.9rem);
      color: var(--accent-dark);
      margin-bottom: 0.6rem;
    }
    .cover-title {
      font-family: "Abril Fatface", "Cormorant Garamond", serif;
      font-weight: 400;
      font-size: clamp(2.2rem, 8vw, 4.4rem);
      line-height: 1;
      letter-spacing: 0.02em;
      color: var(--ink);
      margin: 0 0 0.3rem;
      text-shadow: 2px 2px 0 rgba(218, 41, 28, 0.18);
    }
    .cover-rule {
      width: 55%;
      height: 0;
      border-top: 1px solid var(--ink-soft);
      border-bottom: 1px solid var(--ink-soft);
      padding-top: 3px;
      margin: 0.8rem auto;
      opacity: 0.7;
    }
    .cover-ornament {
      font-family: "Abril Fatface", serif;
      color: var(--accent);
      font-size: 1.4rem;
      letter-spacing: 0.6em;
      margin: 0.2rem 0 0.6rem;
      padding-left: 0.3em;
    }
    .cover-sub {
      font-family: "Special Elite", "Roboto Condensed", monospace;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-size: clamp(0.75rem, 1.8vw, 0.95rem);
      color: var(--ink-soft);
    }
    .cover-edition {
      margin-top: 1.2rem;
      font-family: "Special Elite", "Roboto Condensed", monospace;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 0.7rem;
      color: var(--ink-soft);
    }

    /* TOC */
    .toc-title,
    .song-title {
      font-family: "Abril Fatface", "Cormorant Garamond", serif;
      font-weight: 400;
      font-size: clamp(1.7rem, 4.4vw, 2.4rem);
      color: var(--ink);
      margin: 0 0 0.2rem;
      text-align: center;
      letter-spacing: 0.02em;
    }
    .section-rule {
      width: 40%;
      height: 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding-top: 2px;
      margin: 0.4rem auto 1.2rem;
    }
    .toc-list {
      list-style: none;
      margin: 0;
      padding: 0;
      font-family: "Special Elite", "Roboto Condensed", monospace;
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      color: var(--ink);
    }
    .toc-list li {
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
      padding: 0.35rem 0;
      border-bottom: 1px dotted rgba(74, 56, 38, 0.4);
    }
    .toc-list a {
      color: var(--ink);
      text-decoration: none;
      transition: color 0.2s ease;
      flex: 0 0 auto;
      font-weight: 400;
    }
    .toc-list a:hover,
    .toc-list a:focus {
      color: var(--accent);
      outline: none;
    }
    .toc-leader {
      flex: 1 1 auto;
      border-bottom: 1px dotted rgba(74, 56, 38, 0.55);
      transform: translateY(-3px);
      margin: 0 0.3rem;
    }
    .toc-pagenum {
      flex: 0 0 auto;
      font-family: "Special Elite", "Roboto Condensed", monospace;
      font-size: 0.95em;
      color: var(--ink-soft);
    }

    /* Song page */
    .lyrics {
      margin: 0;
      white-space: pre-wrap;
      color: var(--ink);
      font-size: clamp(0.92rem, 1.95vw, 1.05rem);
      line-height: 1.55;
      font-family: "Special Elite", "Courier New", monospace;
    }

    .loading-page {
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--ink-soft);
      font-family: "Special Elite", "Roboto Condensed", monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Navigation */
    .nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin: 1rem auto 0;
      max-width: 760px;
    }
    .nav button {
      background: rgba(241, 228, 201, 0.06);
      color: #e3d8c6;
      border: 1px solid rgba(241, 228, 201, 0.32);
      font-family: "Roboto Condensed", "Special Elite", monospace;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.78rem;
      padding: 0.55rem 1.1rem;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }
    .nav button:hover:not(:disabled) {
      background: rgba(218, 41, 28, 0.22);
      border-color: var(--accent);
      color: #fff;
      transform: translateY(-1px);
    }
    .nav button:disabled {
      opacity: 0.32;
      cursor: not-allowed;
    }
    .nav .indicator {
      font-family: "Special Elite", "Roboto Condensed", monospace;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #c9b993;
      min-width: 7rem;
      text-align: center;
    }
    .hint {
      text-align: center;
      margin: 0.5rem 0 0;
      color: #7a6a52;
      font-family: "Special Elite", "Roboto Condensed", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    /* Responsive */
    @media (max-width: 991px) {
      .book { transform: rotateX(10deg) rotateZ(-1.5deg); }
    }
    @media (max-width: 600px) {
      body { padding: 0.6rem 0.5rem 1rem; }
      .logo-link img { width: 22vw; max-width: 64px; }
      .book {
        aspect-ratio: 3 / 4.2;
        max-height: calc(100vh - 170px);
        transform: rotateX(6deg) rotateZ(-0.6deg);
      }
      .book:hover,
      .book:focus-within { transform: rotateX(2deg) rotateZ(0deg); }
      .spine { width: 12px; left: -10px; }
      .page-stack { inset: 4px 4px 4px 12px; }
      .nav button { padding: 0.45rem 0.7rem; font-size: 0.7rem; }
      .nav { gap: 0.5rem; }
      .nav .indicator { min-width: 5.5rem; font-size: 0.7rem; }
      .page.flipping-forward,
      .page.flipping-back { animation-duration: 700ms; }
      .page.flipping-forward .page-shade,
      .page.flipping-back .page-shade { animation-duration: 700ms; }
    }

    @media (prefers-reduced-motion: reduce) {
      .book,
      .cover-lid,
      .page,
      .page.flipping-forward,
      .page.flipping-back,
      .page-shade {
        animation: none !important;
        transition: opacity 0.2s ease !important;
        transform: none !important;
      }
      .book.opened .cover-lid { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a href="/jellohead" class="logo-link" aria-label="Back to home">
        <img src="/jellohead/logo.svg" alt="Marv Moses">
      </a>
      <h1 class="page-title"></h1>
    </header>

    <div class="scene">
      <div class="book-shadow">
        <div class="book" id="book" aria-live="polite">
          <div class="cover" aria-hidden="true"></div>
          <div class="spine" aria-hidden="true"></div>
          <div class="page-stack" id="page-stack">
            <div class="page loading-page active" id="loading-page">
              <div>Loading songbook…</div>
            </div>
          </div>
          <div class="cover-lid" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <nav class="nav" aria-label="Songbook navigation">
      <button type="button" id="prev-btn" aria-label="Previous page" disabled>&lsaquo; Prev</button>
      <span class="indicator" id="indicator">— / —</span>
      <button type="button" id="next-btn" aria-label="Next page" disabled>Next &rsaquo;</button>
    </nav>
    <p class="hint">Use the buttons or &larr; &rarr; keys to turn the pages</p>
  </div>

  <script>
    const songs = [
      { title: "A Fire Inside",   file: "A_Fire_Inside.txt" },
      { title: "Come Back Down",  file: "Come_Back_Down.txt" },
      { title: "Greasy Sun",      file: "Greasy_Sun.txt" },
      { title: "Halifax",         file: "Halifax.txt" },
      { title: "Sagebrush",       file: "Sagebrush.txt" },
      { title: "Sunrise",         file: "Sunrise.txt" },
      { title: "Take Two",        file: "Take_Two.txt" },
      { title: "Time Trial",      file: "Time_Trial.txt" },
      { title: "Tired Twin",      file: "Tired_Twin.txt" },
      { title: "Well Dad",        file: "Well_Dad.txt" }
    ];

    const book      = document.getElementById("book");
    const stack     = document.getElementById("page-stack");
    const prevBtn   = document.getElementById("prev-btn");
    const nextBtn   = document.getElementById("next-btn");
    const indicator = document.getElementById("indicator");

    let pages = [];
    let currentIndex = 0;
    let isFlipping = false;

    const reduceMotion = () =>
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function createPage(extraClass) {
      const page = document.createElement("section");
      page.className = "page" + (extraClass ? " " + extraClass : "");
      // shading overlay used during flip
      const shade = document.createElement("div");
      shade.className = "page-shade";
      shade.setAttribute("aria-hidden", "true");
      page.appendChild(shade);
      return page;
    }

    function buildCoverPage() {
      const page = createPage("cover-page");
      const content = document.createElement("div");
      content.className = "page-content";
      content.innerHTML = `
        <div class="cover-eyebrow">Marv Moses Is</div>
        <h2 class="cover-title">Jellohead</h2>
        <div class="cover-rule"></div>
        <div class="cover-ornament" aria-hidden="true">&#10022; &#10022; &#10022;</div>
        <div class="cover-sub">Songbook</div>
        <div class="cover-edition">Deluxe Edition</div>
      `;
      page.appendChild(content);
      return page;
    }

    function buildTocPage(songEntries) {
      const page = createPage("toc");
      const items = songEntries.map((entry, idx) => {
        const songPageIndex = 2 + idx;       // 0=cover, 1=toc
        const displayPageNum = songPageIndex + 1;
        return `
          <li>
            <a href="#" data-page-index="${songPageIndex}">${entry.title}</a>
            <span class="toc-leader" aria-hidden="true"></span>
            <span class="toc-pagenum">${displayPageNum}</span>
          </li>
        `;
      }).join("");

      const content = document.createElement("div");
      content.className = "page-content";
      content.innerHTML = `
        <h2 class="toc-title">Contents</h2>
        <div class="section-rule"></div>
        <ol class="toc-list">${items}</ol>
      `;
      page.appendChild(content);

      const num = document.createElement("div");
      num.className = "page-number";
      num.textContent = "ii";
      page.appendChild(num);
      return page;
    }

    function buildSongPage(title, lyrics, pageNum) {
      const page = createPage("song");
      const content = document.createElement("div");
      content.className = "page-content";

      const heading = document.createElement("h2");
      heading.className = "song-title";
      heading.textContent = title;

      const rule = document.createElement("div");
      rule.className = "section-rule";

      const pre = document.createElement("pre");
      pre.className = "lyrics";
      pre.textContent = lyrics;

      content.appendChild(heading);
      content.appendChild(rule);
      content.appendChild(pre);
      page.appendChild(content);

      const num = document.createElement("div");
      num.className = "page-number";
      num.textContent = pageNum;
      page.appendChild(num);
      return page;
    }

    function buildErrorPage(title, pageNum) {
      const page = createPage("song");

      const content = document.createElement("div");
      content.className = "page-content";
      content.style.display = "flex";
      content.style.flexDirection = "column";
      content.style.alignItems = "center";
      content.style.justifyContent = "center";
      content.style.textAlign = "center";

      const heading = document.createElement("h2");
      heading.className = "song-title";
      heading.textContent = title;

      const rule = document.createElement("div");
      rule.className = "section-rule";

      const msg = document.createElement("p");
      msg.textContent = "Lyrics unavailable right now.";
      msg.style.cssText =
        "color: var(--accent); font-family: 'Special Elite', 'Roboto Condensed', monospace; " +
        "letter-spacing: 0.1em; text-transform: uppercase; font-size: 0.85rem;";

      content.appendChild(heading);
      content.appendChild(rule);
      content.appendChild(msg);
      page.appendChild(content);

      const num = document.createElement("div");
      num.className = "page-number";
      num.textContent = pageNum;
      page.appendChild(num);
      return page;
    }

    function updateIndicator() {
      const total = pages.length;
      indicator.textContent = `${currentIndex + 1} / ${total}`;
      prevBtn.disabled = currentIndex <= 0 || isFlipping;
      nextBtn.disabled = currentIndex >= total - 1 || isFlipping;
    }

    function showPage(index, direction) {
      if (index < 0 || index >= pages.length) return;
      if (index === currentIndex) return;

      const current = pages[currentIndex];
      const target  = pages[index];

      if (reduceMotion()) {
        current.classList.remove("active");
        target.classList.add("active");
        currentIndex = index;
        updateIndicator();
        return;
      }

      isFlipping = true;
      updateIndicator();

      if (direction === "forward") {
        target.classList.add("active");
        current.classList.add("flipping-forward");
        const onEnd = () => {
          current.classList.remove("active", "flipping-forward");
          current.style.transform = "";
          currentIndex = index;
          isFlipping = false;
          updateIndicator();
          current.removeEventListener("animationend", onEnd);
        };
        current.addEventListener("animationend", onEnd);
      } else {
        target.style.transform = "rotateY(-178deg)";
        target.classList.add("active", "flipping-back");
        const onEnd = () => {
          current.classList.remove("active");
          target.classList.remove("flipping-back");
          target.style.transform = "";
          currentIndex = index;
          isFlipping = false;
          updateIndicator();
          target.removeEventListener("animationend", onEnd);
        };
        target.addEventListener("animationend", onEnd);
      }
    }

    function goNext() {
      if (isFlipping) return;
      if (currentIndex < pages.length - 1) showPage(currentIndex + 1, "forward");
    }
    function goPrev() {
      if (isFlipping) return;
      if (currentIndex > 0) showPage(currentIndex - 1, "backward");
    }
    function goTo(index) {
      if (isFlipping || index === currentIndex) return;
      const direction = index > currentIndex ? "forward" : "backward";
      showPage(index, direction);
    }

    prevBtn.addEventListener("click", goPrev);
    nextBtn.addEventListener("click", goNext);

    document.addEventListener("keydown", (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); goNext(); }
      else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); goPrev(); }
      else if (e.key === "Home") { e.preventDefault(); goTo(0); }
      else if (e.key === "End")  { e.preventDefault(); goTo(pages.length - 1); }
    });

    async function loadSongbook() {
      const results = await Promise.allSettled(
        songs.map(async ({ title, file }) => {
          const safeFile = encodeURIComponent(file);
          const response = await fetch(`/assets/lyrics/${safeFile}`);
          if (!response.ok) {
            throw new Error(`Could not load ${file}: ${response.status} ${response.statusText}`);
          }
          const text = await response.text();
          return { title, lyrics: text };
        })
      );

      const loaded = results.map((result, idx) => {
        if (result.status === "fulfilled") {
          return { title: songs[idx].title, lyrics: result.value.lyrics, ok: true };
        }
        console.error("Songbook lyric load failure:", songs[idx].title, result.reason);
        return { title: songs[idx].title, lyrics: "", ok: false };
      });

      // Reset page stack
      stack.textContent = "";
      pages = [];

      // Pages
      pages.push(buildCoverPage());
      pages.push(buildTocPage(loaded));
      loaded.forEach((entry, idx) => {
        const pageNum = idx + 3;
        pages.push(entry.ok
          ? buildSongPage(entry.title, entry.lyrics, pageNum)
          : buildErrorPage(entry.title, pageNum));
      });

      pages.forEach((p) => stack.appendChild(p));
      pages[0].classList.add("active");
      currentIndex = 0;
      updateIndicator();

      // TOC links
      stack.addEventListener("click", (e) => {
        const link = e.target.closest("a[data-page-index]");
        if (!link) return;
        e.preventDefault();
        const idx = parseInt(link.getAttribute("data-page-index"), 10);
        if (Number.isInteger(idx) && idx >= 0 && idx < pages.length) goTo(idx);
      });

      // Open the cover after a beat
      requestAnimationFrame(() => {
        setTimeout(() => book.classList.add("opened"), 350);
      });
    }

    loadSongbook();
  </script>
</body>
</html>
